<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A back-to-top link shown once the page is scrolled</title>
<style>
  .hidden { display: none; }
  .opacity-0 { opacity: 0; }
  .transition-opacity { transition: opacity 500ms; }
  #button-top { position: fixed; right: 1rem; bottom: 1rem; width: 2rem; height: 2rem; background: #036; color: #fff; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  section { height: 400px; }
</style></head>
<body>
<main>
  <h1>Guidance</h1>
  <section><p>First part.</p></section>
  <section><p>Second part.</p></section>
  <section><p>Third part.</p></section>
  <section><p>Fourth part.</p></section>
  <section><p>Fifth part.</p></section>
</main>
<a href="#top" id="button-top" class="transition-opacity opacity-0 hidden"><span class="sr-only">Back to top</span></a>
<footer><p>The end of the page.</p></footer>
<script>
  // ico.org.uk js/index.js: the link is shown once the page is scrolled (`hidden` and `opacity-0` come off) and hidden again when it is back at the top,
  // on a scroll listener rate-limited to 500 ms (a throttle: the first call at once, one more at the end of the wait).
  const hidden = 'hidden', faded = 'opacity-0', link = document.getElementById('button-top');
  function update() { 0 === window.scrollY ? link.classList.add(faded) : link.classList.remove(hidden, faded); }
  function throttle(fn, wait) {
    let last = 0, timer = null;
    return () => {
      const left = wait - (Date.now() - last);
      if (left <= 0) { last = Date.now(); fn(); }
      else if (!timer) timer = setTimeout(() => { timer = null; last = Date.now(); fn(); }, left);
    };
  }
  link.addEventListener('transitionend', () => { if (link.classList.contains(faded)) link.classList.add(hidden); });
  window.addEventListener('scroll', throttle(update, 500));
  update();
</script>
</body>
</html>
