<body lang="en" onload="document.getElementById('loadStatus').innerHTML='Test page load complete'">

			<div>
			  <button id='trigger0'>trigger 0</button>

				  let focusTarget = document.querySelector('#target0');

				  focusTarget.focus();
				})
			</script>
