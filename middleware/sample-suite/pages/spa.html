<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shop</title></head>
<body>
<nav aria-label="Sections"><a href="/spa.html#/shoes" id="shoes">Shoes</a> <a href="/spa.html#/boots" id="boots">Boots</a></nav>
<main><h1 id="title">Shop</h1><p id="body">Pick a section.</p></main>
<script>
  const sections = { '/shoes': ['Shoes', 'Our shoes.'], '/boots': ['Boots', 'Our boots.'] };
  function route() { const s = sections[location.hash.slice(1)]; if (!s) return; document.title = s[0] + ' - Shop'; document.getElementById('title').textContent = s[0]; document.getElementById('body').textContent = s[1]; }
  addEventListener('hashchange', route);
</script>
</body></html>
