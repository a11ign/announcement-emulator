<!doctype html><html lang="en"><head><meta charset="utf-8"><title>table control</title></head><body>
<p>Hello, world!</p>
<table border=3>
<tr><td>A1</td><td>B1</td><td rowspan=2>C1+C2</td><td>D1</td><td>E1</td></tr>
<tr><td>A2</td><td>B2</td><td>D2</td><td>E2</td></tr>
<tr><td colspan=2>A3+B3</td><td>C3</td><td colspan=2>D3+E3</td></tr>
<tr><td>A4</td><td>B4</td><td colspan=2 rowspan=2>C4+D4+<br>C5+D5</td><td>E4</td></tr>
<tr><td>A5</td><td>B5</td><td>E5</td></tr>
</table><p>Bye-bye, world!</p></body></html>
