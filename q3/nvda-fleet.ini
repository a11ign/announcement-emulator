schemaVersion = 22
# The fleet's NVDA 2026.1.1 settings as the worker's own /diagnostics reports them (`screenReaderSettings`, NVDA's saved user config, so only what
# is not a default), read from a11y-worker-2 on 2026-10-20. Everything absent is NVDA's default. The system tests use another file
# (tests/system/nvdaSettingsFiles/standard-dontShowWelcomeDialog.ini: reportLinkType off, unicodeNormalization DISABLED), which is why Q2 and Q3 differ here.
[general]
	language = en
	showWelcomeDialogAtStartup = False
	saveConfigurationOnExit = False
	askToExit = False
	playStartAndExitSounds = False
[update]
	allowUsageStats = False
	askedAllowUsageStats = True
	autoCheck = False
	startupNotification = False
[speech]
	reportNotSupportedLanguage = speech
	autoLanguageSwitching = True
[documentFormatting]
	reportEmphasis = True
	reportLanguage = True
[virtualBuffers]
	autoSayAllOnPageLoad = False
