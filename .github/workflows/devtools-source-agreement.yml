# The DevTools tree source, the only one, measured against the fleet on 19 pages (A11-229, step 4: middleware/results/devtools-source/rule.md): two runs of each of the sample suite's `corpus`, `structure` and `large`
# projects on a `macos-latest` runner, and the same runs on an `ubuntu-latest` runner in the same workflow run as a control. The control separates "the runner sees other pages or a slower network" from "macOS's
# tree differs". It runs in Playwright 1.64.1's Chromium, the one the other readings of this measurement use.
#
# It is started by committing middleware/results/devtools-source/ci-run.txt: the worker that takes the fleet's captures commits the stamp inside the capture window, and the run is read within about two hours of them.
#
# The reports hold the predicted speech of third-party pages and this repository is public: they go to an artifact kept one day, are downloaded with `gh run download`, and the artifact is deleted once
# downloaded. Only the tables and each miss are committed (middleware/results/agreement/README.md).
name: devtools-source-agreement

on:
  push:
    paths:
      - middleware/results/devtools-source/ci-run.txt
  # By hand, from a branch, inside a capture window. There is no `schedule` (A11-260): a reading is valid only within about two hours of the fleet captures (rule.md), so a nightly run would spend its macOS minutes on a reading the rule throws away.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtools-source-agreement-${{ github.ref }}
  cancel-in-progress: false

env:
  CHROMIUM: "156.0.8078.4"
  PLAYWRIGHT: "1.64.1"

jobs:
  reading:
    # a measurement is made on a branch, inside a capture window: merging the stamp to the default branch must not run it again (a dispatch is somebody asking for one)
    if: github.event_name == 'workflow_dispatch' || github.ref_name != github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reading: devtools-macos, platform: darwin-arm64, runner: macos-latest, deps: "" }
          - { reading: devtools-ubuntu-ci, platform: linux-x64, runner: ubuntu-latest, deps: "--with-deps" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: middleware/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # the runtime bundle holds no browser: the Chromium sources and NVDA's are read at their pins, and nothing is installed on the runner for it
      - run: middleware/bundle/build.sh ${{ matrix.platform }} "$RUNNER_TEMP/bundle"
      # The package is built here and packed as `npm pack` packs it; the pin it carries is the sha256 of the bundle just built (middleware-spike.yml does the same).
      - run: |
          node bundle/write-pins.mjs "$(node -p "require('./package.json').version")" "$RUNNER_TEMP"/bundle/pin-*.json > pins.json
          pnpm install --frozen-lockfile && pnpm run build && npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: middleware
      # One project with its own @playwright/test and the Chromium that version ships.
      - run: |
          mkdir "$RUNNER_TEMP/mirror" && ln -s "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/mirror/v$(node -p "require('./middleware/package.json').version")"      # a mirror lays a Release out as <host>/v<version>/<file>
          (cd "$RUNNER_TEMP/mirror" && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          cp -R middleware/sample-suite "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm i -D "$RUNNER_TEMP"/a11ign-announcement-emulator-*.tgz "@playwright/test@$PLAYWRIGHT"
          npx playwright install ${{ matrix.deps }} chromium
          ANNOUNCEMENT_EMULATOR_DOWNLOAD_HOST=http://127.0.0.1:8099 npx announcement-emulator install
      # Two runs of each project, the focus the way the fleet's focus probe reads it (rule.md). A failing test is a reading, not a failure of the job. A run whose workers report another Chromium build than the one
      # this measurement names is not kept.
      - id: runs
        run: |
          middleware/agreement/run_devtools_readings.sh "$RUNNER_TEMP/project" "$RUNNER_TEMP/runs" || true
          for run in "$RUNNER_TEMP"/runs/devtools-*/*; do
            node -e 'const w = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).workers; if (!w.length || !w.every((x) => x.startup?.chromium === process.argv[2])) { console.error("the run reports another Chromium build than " + process.argv[2]); process.exit(1) }' "$run/run.json" "$CHROMIUM"
          done
          printf '{ "reading": "%s", "chromium": "%s", "playwright": "%s", "runner": "%s", "os": "%s", "arch": "%s" }\n' "${{ matrix.reading }}" "$CHROMIUM" "$PLAYWRIGHT" "${{ matrix.runner }}" "$RUNNER_OS" "$RUNNER_ARCH" > "$RUNNER_TEMP/runs/runner.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devtools-source-${{ matrix.reading }}
          path: ${{ runner.temp }}/runs
          retention-days: 1
          if-no-files-found: error
