# The DevTools tree source on macOS, measured against the fleet (A11-229, middleware/results/tree-source/rule.md): two runs of the sample suite's `corpus` project, with the DevTools port as the
# tree source, on a `macos-latest` runner, and the same two runs on an `ubuntu-latest` runner in the same workflow run as a control. The control separates "the runner sees other pages or a
# slower network" from "macOS's tree differs".
#
# It is started by committing middleware/results/tree-source/ci-run.txt, because GitHub dispatches only workflows that are on the default branch and this one is not yet: the worker that takes the fleet's
# captures commits the stamp inside the capture window, and the run is read within about two hours of them.
#
# The reports hold the predicted speech of third-party pages and this repository is public: they go to an artifact kept one day, are downloaded with `gh run download`, and the artifact is deleted
# once downloaded. Only the tables and each miss are committed (middleware/results/agreement/README.md).
name: tree-source-agreement

on:
  push:
    paths:
      - middleware/results/tree-source/ci-run.txt
  # By hand, from a branch, inside a capture window. There is no `schedule` (A11-260): a reading is valid only within about two hours of the fleet captures (rule.md), so a nightly run would spend its macOS minutes on a reading the rule throws away.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tree-source-agreement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reading:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reading: devtools-macos, platform: darwin-arm64, runner: macos-latest }
          - { reading: devtools-ubuntu-ci, platform: linux-x64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # the Chrome libraries are downloaded as .deb files and unpacked into the bundle; nothing is installed on the runner
      - if: matrix.platform == 'linux-x64'
        run: sudo apt-get update
      - run: middleware/bundle/build.sh ${{ matrix.platform }} "$RUNNER_TEMP/bundle"
      - uses: pnpm/action-setup@v6
        with: { package_json_file: middleware/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # The package is built here and packed as `npm pack` packs it; the pin it carries is the sha256 of the bundle just built (middleware-spike.yml does the same).
      - run: |
          node bundle/write-pins.mjs "$(node -p "require('./package.json').version")" "$RUNNER_TEMP"/bundle/pin-*.json > pins.json
          pnpm install --frozen-lockfile && pnpm run build && npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: middleware
      - run: |
          cp -R middleware/sample-suite "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm i -D "$RUNNER_TEMP"/a11ign-announcement-emulator-*.tgz @playwright/test@1.64.1
      - run: |
          mkdir "$RUNNER_TEMP/mirror" && ln -s "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/mirror/v$(node -p "require('./middleware/package.json').version")"      # a mirror lays a Release out as <host>/v<version>/<file>
          (cd "$RUNNER_TEMP/mirror" && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          cd "$RUNNER_TEMP/project"
          ANNOUNCEMENT_EMULATOR_DOWNLOAD_HOST=http://127.0.0.1:8099 npx announcement-emulator install
      # Two runs of the corpus project, the DevTools port as the tree source whatever the platform's default is, and the focus the way the fleet's focus probe reads it (rule.md).
      - id: runs
        run: |
          cd "$RUNNER_TEMP/project"
          mkdir -p "$RUNNER_TEMP/runs"
          export ANNOUNCEMENT_EMULATOR_TREE=devtools ANNOUNCEMENT_EMULATOR_REPORT_FOCUS=1
          for n in 1 2; do
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            npx playwright test --project=corpus || true
            finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            mkdir -p "$RUNNER_TEMP/runs/run$n"
            cp test-results/report.json "$RUNNER_TEMP/runs/run$n/report.json"
            cp test-results/announcement-emulator/run.json "$RUNNER_TEMP/runs/run$n/run.json"
            printf '{ "reading": "%s", "run": %s, "startedAt": "%s", "finishedAt": "%s", "runner": "%s", "os": "%s", "arch": "%s" }\n' "${{ matrix.reading }}" "$n" "$started" "$finished" "${{ matrix.runner }}" "$RUNNER_OS" "$RUNNER_ARCH" > "$RUNNER_TEMP/runs/run$n/times.json"
            rm -rf test-results playwright-report
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tree-source-${{ matrix.reading }}
          path: ${{ runner.temp }}/runs
          retention-days: 1
          if-no-files-found: error
