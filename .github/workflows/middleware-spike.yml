# The Playwright middleware spike (A11-208): the package is tested, the runtime bundle is built for each platform, and the sample suite, which has no screen-reader code in it, is run with the
# middleware attached on a plain GitHub-hosted runner: no container, no Docker, no setup beyond `npm i -D`, `npx playwright install chromium` and `npx foresay install`. The browser is the one
# Playwright installs for the team's version (A11-230): the bundle holds none.
#
# The runtime bundle is lean (A11-231): a stripped Python and the files a trace of the runtime read, in one copy of NVDA's source (middleware/bundle/trace.sh makes the list, keep/<platform>.txt). Three proofs run
# here: the transcripts of every recorded session are byte for byte the full layout's (`transcripts`), a run of the sample suite that wants a file the bundle lacks fails (`demo`), and `trace` makes the lists
# again and fails on a file they lack. That the archive is the same bytes when it is built twice is checked where a release is made: release-bundles.yml, which release-dry-run.yml calls nightly.
#
# WHAT RUNS WHEN (A11-260). Every build is paid for in minutes, and a macOS minute costs ten times a Linux one, so the workflow runs only what a change needs:
#   * a pull request that touches a path below runs PR MODE: the Linux bundle (built once, and shared as an artifact with every job that needs it), its `transcripts`, the Linux `trace`, the primary Playwright's Linux `demo` row, and ONE
#     macOS job, the darwin-arm64 row of the primary Playwright, which builds its own bundle. A pull request that touches none of the paths (docs, results) runs nothing here. A draft runs nothing: `ready_for_review` runs it.
#     The linux-arm64 bundle (A11-232) is built, its `transcripts` and its `trace` run in both modes, on GitHub's free arm runners (the repository is public), so that a module the arm list lacks fails in the pull request that needs it, as on the other two. It has no `demo` row: the supported
#     Playwright versions are measured on x64 Linux and on macOS (supported-versions.json), and no agreement has been measured on arm.
#   * the nightly run on `main`, `workflow_dispatch` and `workflow_call` (a release) run FULL MODE: every platform, every row. Dispatching this file on a branch is full mode on that branch.
#   * a push, a merge-queue entry or a merge to `main` runs nothing here: this workflow is not part of ci.yml's `gate`, so the queue does not wait on it. (release.yml calls it on a push to `main`, once the package is not private.)
# The matrices come from the `mode` job, so that the one macOS job of a pull request is a row of the same `bundle`, `trace` and `demo` definitions and not a copy of them (middleware/src/ci-shape.test.ts runs it).
#
# Nothing is published. The bundle travels as a workflow artifact and the `demo` jobs serve it from a static server on the runner, so that `install` does its real http download, its
# checksum and its unpack. A release serves it from its GitHub Release (release-bundles.yml builds it, release-dry-run.yml rehearses it); here it is a mirror, as ANNOUNCEMENT_EMULATOR_DOWNLOAD_HOST names one: <host>/v<version>/<file>.
name: middleware-spike

on:
  # `paths` is what makes a docs-only or results-only pull request run nothing here: the bundle's inputs (build.sh copies emu/, q2/ and q3/ and reads pins.env), the runtime, the package the demo installs, and this file.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/middleware-spike.yml"
      - "middleware/bundle/**"
      - "middleware/runtime/**"
      - "middleware/src/**"
      - "middleware/sample-suite/**"
      - "middleware/package.json"
      - "middleware/pnpm-lock.yaml"
      - "middleware/supported-versions.json"
      - "middleware/rslib.config.ts"
      - "middleware/tsconfig.build.json"
      - "pins.env"
      - "emu/**"
      - "q1/**"
      - "q2/**"
      - "q3/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A nightly, a dispatch and a release run are never cancelled. `github.workflow` is the CALLING workflow's name in a call, so a release's run (`release`) is not in the
# nightly's group: GitHub keeps one pending run per group and drops the older when a newer queues, which would otherwise skip a release's `spike` job (and with it the release) behind a nightly run.
concurrency:
  group: middleware-spike-${{ github.event.pull_request.number || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides the mode and the matrices of the jobs below. The rows of the `demo` matrix are here: supported.test.ts reads them and holds each to supported-versions.json.
  mode:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.mode.outputs.bundle }}
      trace: ${{ steps.mode.outputs.trace }}
      demo: ${{ steps.mode.outputs.demo }}
    steps:
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          linux_bundle='{ "platform": "linux-x64", "runner": "ubuntu-latest" }'
          arm_bundle='{ "platform": "linux-arm64", "runner": "ubuntu-24.04-arm" }'
          darwin_bundle='{ "platform": "darwin-arm64", "runner": "macos-latest" }'
          linux_trace='{ "platform": "linux-x64", "runner": "ubuntu-latest", "deps": "--with-deps" }'
          arm_trace='{ "platform": "linux-arm64", "runner": "ubuntu-24.04-arm", "deps": "--with-deps" }'
          darwin_trace='{ "platform": "darwin-arm64", "runner": "macos-latest", "deps": "" }'
          # The accessibility tree is read through the browser's DevTools port, on every platform: there is one tree source (A11-229), so a row has one source and no other to run.
          # `chromium` is the build the row's Playwright ships (its playwright-core/browsers.json): the report of every worker is held to having run in it, and to the sentence of its row's `agreement` (below). 1.63.0 and 1.64.1 are the two versions the list starts with; 1.62.1 is the newest 1.62 and is not meant to be listed: it holds the wording of an unlisted version.
          # `agreement` is what the reports say: `measured` for a build that middleware/supported-versions.json lists with a figure for the platform's DevTools reading, `unmeasured` for any other (supported.test.ts holds
          # every row to the list).
          # A pull request runs the `primary` row of each platform and the nightly run the others (they are the same suite in the older Playwrights: the longest jobs of the run). `primary` rows also take the cost. `build` is a row that builds the bundle it runs on, in its own job, because no `bundle` job built that platform's (the one macOS job of a pull request).
          linux_primary='{ "platform": "linux-x64", "runner": "ubuntu-latest", "playwright": "1.64.1", "agreement": "measured", "chromium": "156.0.8078.4", "deps": "--with-deps", "primary": true, "build": false }'
          linux_others='{ "platform": "linux-x64", "runner": "ubuntu-latest", "playwright": "1.63.0", "agreement": "measured", "chromium": "153.0.8010.12", "deps": "--with-deps", "primary": false, "build": false },
          { "platform": "linux-x64", "runner": "ubuntu-latest", "playwright": "1.62.1", "agreement": "unmeasured", "chromium": "151.0.7922.34", "deps": "--with-deps", "primary": false, "build": false }'
          darwin_primary='{ "platform": "darwin-arm64", "runner": "macos-latest", "playwright": "1.64.1", "agreement": "measured", "chromium": "156.0.8078.4", "deps": "", "primary": true, "build": BUILD }'
          darwin_second='{ "platform": "darwin-arm64", "runner": "macos-latest", "playwright": "1.63.0", "agreement": "measured", "chromium": "153.0.8010.12", "deps": "", "primary": false, "build": false }'
          if [ "$EVENT_NAME" = pull_request ]; then
            mode="pull request"
            bundle="$linux_bundle, $arm_bundle"; trace="$linux_trace, $arm_trace"; demo="$linux_primary, ${darwin_primary/BUILD/true}"
          else
            mode=full
            bundle="$linux_bundle, $arm_bundle, $darwin_bundle"; trace="$linux_trace, $arm_trace, $darwin_trace"; demo="$linux_primary, $linux_others, ${darwin_primary/BUILD/false}, $darwin_second"
          fi
          {
            echo "bundle={\"include\": [$bundle]}"
            echo "trace={\"include\": [$trace]}"
            echo "demo={\"include\": [$(echo "$demo" | tr -d '\n')]}"
          } >> "$GITHUB_OUTPUT"
          echo "mode: $mode" >> "$GITHUB_STEP_SUMMARY"

  # One lean bundle for each platform, built here: a stripped Python with the packages in it, and the files of NVDA's source and of the standard library that a trace of the runtime read (keep/<platform>.txt), in one copy.
  # The full layout is built beside it (--full-dir): what a run could read, nothing pruned. It is the one build of the platform in this run: `transcripts`, `trace` and `demo` take it as
  # the `full-<platform>` artifact (a tar, which keeps the modes that an artifact's zip would lose) and do not build it again. No browser and no browser library: check_no_browser.py fails the job on an archive that holds one.
  bundle:
    needs: mode
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode.outputs.bundle) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        run: |
          start=$(date +%s)
          middleware/bundle/build.sh ${{ matrix.platform }} "$RUNNER_TEMP/bundle" --full-dir "$RUNNER_TEMP/full"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "archive=$(basename "$(ls "$RUNNER_TEMP"/bundle/announcement-emulator-bundle-*.tar.* | grep -v '\.sha256$')")" >> "$GITHUB_OUTPUT"
      # The full layout, before anything runs in it, for the jobs that take it from here.
      - run: |
          mkdir "$RUNNER_TEMP/full-out"
          tar -cf "$RUNNER_TEMP/full-out/full-${{ matrix.platform }}.tar" -C "$RUNNER_TEMP" full
      # No browser and no browser library in the archive that is shipped; the size, by part, against the spike's and against the full layout; the three formats' sizes and unpack times.
      - run: |
          python3 middleware/bundle/check_no_browser.py "$RUNNER_TEMP/bundle/${{ steps.build.outputs.archive }}"
          mkdir "$RUNNER_TEMP/unpacked" && tar -xf "$RUNNER_TEMP/bundle/${{ steps.build.outputs.archive }}" -C "$RUNNER_TEMP/unpacked"
          python3 middleware/bundle/check_no_browser.py "$RUNNER_TEMP/unpacked"
          mkdir "$RUNNER_TEMP/formats-out"
          { echo "### Bundle size ${{ matrix.platform }}"; echo
            python3 middleware/bundle/sizes.py table "$RUNNER_TEMP/unpacked" --platform ${{ matrix.platform }} --archive "$RUNNER_TEMP/bundle/${{ steps.build.outputs.archive }}" --column "Full layout (nothing pruned)=$RUNNER_TEMP/full"
            echo; echo "### Formats ${{ matrix.platform }}"; echo
            python3 middleware/bundle/sizes.py formats "$RUNNER_TEMP/unpacked" --json "$RUNNER_TEMP/formats-out/formats-${{ matrix.platform }}.json" --keep "$RUNNER_TEMP/formats"; } | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      # What a plain ubuntu:24.04 container's tar does with each format is reported with the sizes, and does not decide: that image has neither an xz nor a zstd program, so it unpacks only gzip (A11-231).
      - if: matrix.platform == 'linux-x64'
        run: |
          for fmt in xz zst; do
            if docker run --rm -v "$RUNNER_TEMP/formats:/f:ro" ubuntu:24.04 sh -c "mkdir /o && tar -xf /f/bundle.tar.$fmt -C /o && test -f /o/bundle.json"; then result=ok; else result=failed; fi
            echo "$fmt=$result" | tee -a "$RUNNER_TEMP/formats-out/container.txt"
          done
      - run: |
          { echo "### Bundle ${{ matrix.platform }}"; echo; echo "built in ${{ steps.build.outputs.seconds }} s"; echo; ls -l "$RUNNER_TEMP/bundle"; cat "$RUNNER_TEMP/bundle"/pin-*.json; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/bundle
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: formats-${{ matrix.platform }}
          path: ${{ runner.temp }}/formats-out
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: full-${{ matrix.platform }}
          path: ${{ runner.temp }}/full-out
          compression-level: 0
          retention-days: 3

  # The transcripts: every recorded session, replayed with sweeps, without and with --report-focus, under the full layout and under the lean bundle as it was archived. The outputs must be the same bytes (the clock left out).
  # Both come from the `bundle` job as artifacts. A job of its own, as it was (`bundle-identical`), so that a difference reddens this job and leaves `trace`, which makes the list that fixes it, and `demo` to run.
  transcripts:
    needs: [mode, bundle]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode.outputs.bundle) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: "bundle-${{ matrix.platform }}", path: "${{ runner.temp }}/bundle" }
      - uses: actions/download-artifact@v8
        with: { name: "full-${{ matrix.platform }}", path: "${{ runner.temp }}/full-tar" }
      - run: |
          tar -xf "$RUNNER_TEMP/full-tar/full-${{ matrix.platform }}.tar" -C "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/lean" && tar -xf "$(ls "$RUNNER_TEMP"/bundle/announcement-emulator-bundle-*.tar.* | grep -v '\.sha256$')" -C "$RUNNER_TEMP/lean"
          { echo "### Transcripts ${{ matrix.platform }}"; echo; echo '```'; python3 middleware/bundle/compare_bundles.py replay "$RUNNER_TEMP/full" "$RUNNER_TEMP/lean" 2>&1; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  # The format the bundle is built in is the one that was measured: the smaller of xz and zstd among those that unpack in 5 s or less on the x64 Linux and macOS runners (both in full mode, Linux alone in a pull request) with the host's tar. The arm bundle's formats are uploaded and not part of the choice: it ships in the format the other two were measured to. The job fails when build.sh's default is
  # any other.
  bundle-format:
    needs: bundle
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: "formats-*", path: "${{ runner.temp }}/formats", merge-multiple: true }
      - run: |
          cd "$RUNNER_TEMP/formats"
          containers=""; for line in $(cat container.txt); do containers="$containers --container $line"; done
          python3 "$GITHUB_WORKSPACE/middleware/bundle/sizes.py" choose $(ls formats-linux-x64.json formats-darwin-arm64.json 2>/dev/null) $containers | tee "$RUNNER_TEMP/choice.txt" >> "$GITHUB_STEP_SUMMARY" || true      # it exits 1 when no format is acceptable; the test below then fails on the empty choice
          chosen="$(sed -n 's/^ships: //p' "$RUNNER_TEMP/choice.txt")"
          built="$(sed -n 's/^FORMAT=\([a-z]*\);.*/\1/p' "$GITHUB_WORKSPACE/middleware/bundle/build.sh")"
          echo "measured: $chosen; build.sh builds: $built"
          [ -n "$chosen" ] && [ "$chosen" = "$built" ]

  # The lists again: trace.sh runs everything the lists are made from (every recording, the sample suite's offline project live) in the full layout, and the job fails when a run read a file that
  # keep/<platform>.txt lacks. The lists made here are uploaded: the darwin-arm64 one is made on this runner, and committed from here. The full layout is the `bundle` job's.
  trace:
    needs: [mode, bundle]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode.outputs.trace) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: middleware/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { name: "full-${{ matrix.platform }}", path: "${{ runner.temp }}/full-tar" }
      - run: tar -xf "$RUNNER_TEMP/full-tar/full-${{ matrix.platform }}.tar" -C "$RUNNER_TEMP"
      - run: |
          cp "middleware/bundle/keep/${{ matrix.platform }}.txt" "$RUNNER_TEMP/committed.txt" 2>/dev/null || : > "$RUNNER_TEMP/committed.txt"
          PLAYWRIGHT_DEPS="${{ matrix.deps }}" middleware/bundle/trace.sh ${{ matrix.platform }} --full-dir "$RUNNER_TEMP/full" --traces "$RUNNER_TEMP/traces"
          cp "middleware/bundle/keep/${{ matrix.platform }}.txt" "$RUNNER_TEMP/keep-${{ matrix.platform }}.txt"
          { echo "### Trace ${{ matrix.platform }}"; echo; echo "files the runs read that keep/${{ matrix.platform }}.txt lacks:"; echo '```'; comm -13 "$RUNNER_TEMP/committed.txt" "$RUNNER_TEMP/keep-${{ matrix.platform }}.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$(comm -13 "$RUNNER_TEMP/committed.txt" "$RUNNER_TEMP/keep-${{ matrix.platform }}.txt")" ]
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keep-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/keep-${{ matrix.platform }}.txt
            ${{ runner.temp }}/traces
          if-no-files-found: warn
          retention-days: 14

  # The acceptance: the sample suite, with the middleware attached by the one line, after `npx playwright install chromium` and `npx foresay install`, on a plain runner with no container.
  # The browser is Playwright's: each row installs one Playwright version and the Chromium that version ships, and nothing else (`--with-deps` on Ubuntu is Playwright's own route to its browser's system libraries).
  # The rows are the `mode` job's. In a pull request the macOS row (`build`) builds its own bundle, because no macOS `bundle` job runs; the full layout of every other primary row is the `bundle` job's.
  demo:
    needs: [mode, bundle]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode.outputs.demo) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: middleware/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - if: ${{ !matrix.build }}
        uses: actions/download-artifact@v8
        with: { name: "bundle-${{ matrix.platform }}", path: "${{ runner.temp }}/bundle" }
      - if: ${{ matrix.build }}
        run: |
          middleware/bundle/build.sh ${{ matrix.platform }} "$RUNNER_TEMP/bundle" --full-dir "$RUNNER_TEMP/full"
          python3 middleware/bundle/check_no_browser.py "$(ls "$RUNNER_TEMP"/bundle/announcement-emulator-bundle-*.tar.* | grep -v '\.sha256$')"
      - if: ${{ !matrix.build && matrix.primary }}
        uses: actions/download-artifact@v8
        with: { name: "full-${{ matrix.platform }}", path: "${{ runner.temp }}/full-tar" }
      - if: ${{ !matrix.build && matrix.primary }}
        run: tar -xf "$RUNNER_TEMP/full-tar/full-${{ matrix.platform }}.tar" -C "$RUNNER_TEMP"
      # The package is built here and packed as `npm pack` packs it; the pin it carries is the sha256 of the bundle just built.
      - run: |
          node bundle/write-pins.mjs "$(node -p "require('./package.json').version")" "$RUNNER_TEMP"/bundle/pin-*.json > pins.json
          cat pins.json
          pnpm install --frozen-lockfile && pnpm run build && npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: middleware
      # A user's project: the sample suite, a package.json, `npm i -D` of the package and of this row's Playwright, and Playwright's own Chromium (`npx playwright install chromium`). Nothing else is installed:
      # the runtime bundle holds no browser, and the tests run in the one Playwright installed.
      - run: |
          cp -R middleware/sample-suite "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm i -D "$RUNNER_TEMP"/a11ign-foresay-*.tgz @playwright/test@${{ matrix.playwright }}
          npx playwright install ${{ matrix.deps }} chromium
      # The bundle is served over http from this runner, as a host would serve it; `install` downloads it, refuses it unless it is the pinned sha256, and unpacks it into the cache.
      - run: |
          mkdir "$RUNNER_TEMP/mirror" && ln -s "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/mirror/v$(node -p "require('./middleware/package.json').version")"      # a mirror lays a Release out as <host>/v<version>/<file>
          (cd "$RUNNER_TEMP/mirror" && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          cd "$RUNNER_TEMP/project"
          export ANNOUNCEMENT_EMULATOR_DOWNLOAD_HOST=http://127.0.0.1:8099
          { time npx foresay install; } 2>&1 | tee "$RUNNER_TEMP/install.log"
          npx foresay doctor > "$RUNNER_TEMP/doctor.log" || { cat "$RUNNER_TEMP/doctor.log"; exit 1; }      # a pipe to tee would lose its exit code
          cat "$RUNNER_TEMP/doctor.log"
          grep -q '^Chromium ${{ matrix.chromium }} ' "$RUNNER_TEMP/doctor.log"
          if [ "${{ matrix.agreement }}" = measured ]; then grep -q '^supported: yes, Chromium ${{ matrix.chromium }} is on the list' "$RUNNER_TEMP/doctor.log"; else grep -q '^supported: no\. Chromium ${{ matrix.chromium }} is not on the list' "$RUNNER_TEMP/doctor.log"; fi
      # Run 1: the one line (playwright.config.ts), in the browser the Playwright just installed gives a launch left to it: its headless shell. Run 2: no line at all (`foresay test` wraps playwright.plain.config.ts). Run 3: the same suite without the middleware.
      - id: run
        run: |
          cd "$RUNNER_TEMP/project"
          { time npx playwright test --project=fixtures; } 2>&1 | tee "$RUNNER_TEMP/run-with.log"
          node check-report.mjs --expect-${{ matrix.agreement }} ${{ matrix.chromium }}
          cp -R test-results/announcement-emulator "$RUNNER_TEMP/announcement-emulator-run"; cp test-results/report.json "$RUNNER_TEMP/announcement-emulator-run/report.json"
          rm -rf test-results
          mv playwright-report "$RUNNER_TEMP/playwright-report-one-line"
          { time npx foresay test --config playwright.plain.config.ts --project=fixtures; } 2>&1 | tee "$RUNNER_TEMP/run-zero.log"
          node check-report.mjs --expect-${{ matrix.agreement }} ${{ matrix.chromium }}
          mv playwright-report "$RUNNER_TEMP/playwright-report-zero-lines"
          rm -rf test-results
          [ "${{ matrix.platform }}" = linux-x64 ] && [ "${{ matrix.primary }}" = true ] || exit 0      # the cost is measured once, on Linux: a macOS minute costs ten times a Linux one
          { time npx playwright test --config playwright.baseline.config.ts --project=fixtures; } 2>&1 | tee "$RUNNER_TEMP/run-without.log"
          node cost.mjs --project fixtures --runs 3 --workers 1,2,4 --out "$RUNNER_TEMP/cost.json" 2>&1 | tee "$RUNNER_TEMP/cost.log"
      # The lean bundle against the full layout, live (A11-231). The lean bundle is the one `install` just unpacked; the full layout is the one the bundle was built with. The fixtures project runs with ANNOUNCEMENT_EMULATOR_REPORT_FOCUS=1
      # and the import trace on: twice in the full layout and once in the lean bundle. The check fails on an import or a file the lean run wanted and could not find, where the full layout has it (compare_bundles.py misses), and reports
      # the tests whose predicted speech or flags differ in the lean run where the two full-layout runs agree (compare_live.py: reported, not a failure, because a live run's timing moves a quick test's last event). The traces are uploaded: the darwin-arm64 row's are what keep/darwin-arm64.txt is made from.
      - if: matrix.primary
        run: |
          set -e
          cache="$(ls -d ~/.cache/announcement-emulator/*/ ~/Library/Caches/announcement-emulator/*/ 2>/dev/null | head -1)"; cache="${cache%/}"
          mkdir -p "$RUNNER_TEMP/traces"; cd "$RUNNER_TEMP/project"
          status=0
          for which in full-a full-b lean; do
            dir="$RUNNER_TEMP/full"; [ "$which" = lean ] && dir="$cache"
            rm -rf test-results
            ANNOUNCEMENT_EMULATOR_BUNDLE="$dir" ANNOUNCEMENT_EMULATOR_REPORT_FOCUS=1 ANNOUNCEMENT_EMULATOR_IMPORT_TRACE="$RUNNER_TEMP/traces/live-$which.txt" npx playwright test --project=fixtures || true
            cp test-results/report.json "$RUNNER_TEMP/traces/report-$which.json"
          done
          { echo "### Live comparison, ${{ matrix.platform }}"; echo '```'; python3 "$GITHUB_WORKSPACE/middleware/bundle/compare_live.py" "$RUNNER_TEMP/traces/report-full-a.json" "$RUNNER_TEMP/traces/report-full-b.json" "$RUNNER_TEMP/traces/report-lean.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/traces/live-full-a.txt" "$RUNNER_TEMP/traces/live-full-b.txt" > "$RUNNER_TEMP/traces/live-full.txt"
          python3 "$GITHUB_WORKSPACE/middleware/bundle/compare_bundles.py" misses --full "$RUNNER_TEMP/full" --lean "$cache" --full-trace "$RUNNER_TEMP/traces/live-full.txt" --lean-trace "$RUNNER_TEMP/traces/live-lean.txt" || status=1
          exit $status
      - if: always()
        run: |
          { echo "### Sample suite on ${{ matrix.platform }} (${{ matrix.runner }}, no container), Playwright ${{ matrix.playwright }}, Chromium ${{ matrix.chromium }}"; echo; cat "$RUNNER_TEMP/install.log" 2>/dev/null || true
            for f in run-with run-zero run-without; do echo; echo "#### $f"; tail -8 "$RUNNER_TEMP/$f.log" 2>/dev/null || true; done
            echo; echo '```'; cat "$RUNNER_TEMP/announcement-emulator-run/run.json" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sample-suite-report-${{ matrix.platform }}-playwright-${{ matrix.playwright }}
          path: |
            ${{ runner.temp }}/playwright-report-one-line
            ${{ runner.temp }}/playwright-report-zero-lines
            ${{ runner.temp }}/announcement-emulator-run
            ${{ runner.temp }}/project/test-results/announcement-emulator
            ${{ runner.temp }}/run-*.log
            ${{ runner.temp }}/cost.*
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/doctor.log
            ${{ runner.temp }}/traces
          if-no-files-found: warn
